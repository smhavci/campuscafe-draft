<div class="chatbot-container" [class.open]="isOpen()">
    <!-- Otomatik Mesaj (Hover) -->
    <div class="hover-tip" *ngIf="isHovered() && !isOpen()">
        {{ hoverMessage }}
    </div>

    <!-- Chat Balonu (Kapalıyken) -->
    <button 
        class="chat-trigger" 
        (click)="toggleChat()"
        (mouseenter)="isHovered.set(true)"
        (mouseleave)="isHovered.set(false)">
        <span class="icon">🤖</span>
    </button>

    <!-- Chat Penceresi (Açıkken) -->
    <div class="chat-window" *ngIf="isOpen()">
        <div class="chat-header">
            <h3>Campus AI Asistan</h3>
            <button (click)="toggleChat()" class="close-btn">×</button>
        </div>

        <!-- Mode Selector -->
        <div class="mode-selector">
            <button *ngFor="let mode of availableModes" 
                    class="mode-btn" 
                    [class.mode-active]="activeMode() === mode.id"
                    (click)="setMode(mode.id)">
                <span class="mode-icon">{{ mode.icon }}</span>
                <span class="mode-label">{{ mode.label }}</span>
            </button>
        </div>

        <div class="chat-body" #scrollMe [scrollTop]="scrollMe.scrollHeight">
            <div *ngFor="let msg of messages()" class="message" [class.user]="msg.role === 'user'" [class.ai]="msg.role === 'ai'">
                <div class="bubble" [innerHTML]="msg.html ?? msg.text"></div>
                <span class="msg-time">{{ formatTime(msg.timestamp) }}</span>
            </div>
            <div *ngIf="isLoading()" class="message ai loading">
                <div class="bubble typing-indicator">
                    <span></span><span></span><span></span>
                </div>
            </div>
        </div>

        <div class="chat-footer">
            <input 
                type="text" 
                [(ngModel)]="userInput" 
                (keyup.enter)="sendMessage()" 
                [placeholder]="placeholder"
                [disabled]="isLoading()"
            />
            <button (click)="sendMessage()" [disabled]="isLoading() || !userInput.trim()">➤</button>
        </div>
    </div>
</div>
